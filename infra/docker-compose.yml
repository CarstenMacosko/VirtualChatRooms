# Local infrastructure. Optional in Phase 0: without it the API uses embedded PGlite.
# Start with `pnpm infra:up`, then set DATABASE_URL in .env to use real Postgres.
name: vcr

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: vcr
      POSTGRES_PASSWORD: vcr
      POSTGRES_DB: vcr
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcr -d vcr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.3-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dev mode uses API key "devkey" and secret "secret" (matching .env.example).
  livekit:
    image: livekit/livekit-server:v1.13.10
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880" # HTTP / WebSocket signaling
      - "7881:7881" # WebRTC over TCP
      - "7882:7882/udp" # WebRTC over UDP

  # S3-compatible object storage for room and avatar assets (used from Phase 4).
  # SeaweedFS replaces MinIO, which no longer publishes Docker images.
  storage:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "8333:8333"
    volumes:
      - storage-data:/data

volumes:
  postgres-data:
  storage-data:
