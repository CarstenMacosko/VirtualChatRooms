# Fly.io: one always-on machine (calls need the realm and live events running). See docs/deploy.md.
# Change `app` to the name you create with `fly apps create`; WEB_ORIGIN lists every address the
# web app is opened at (your Cloudflare Pages site, its preview builds and this Fly address).
app = "virtualchatrooms"
primary_region = "iad"
# The API (embedded Postgres) settles near 700 MB and the realm near 150 MB; creating the database on a
# fresh volume briefly needs ~1.2 GB. 1 GB machines get killed for running out of memory.
swap_size_mb = 1024

[build]
  dockerfile = "Dockerfile"

# Clerk's publishable key is public (it ships in the web page); the secret key is a Fly secret.
[build.args]
  VITE_CLERK_PUBLISHABLE_KEY = "pk_test_Y2FyZWZ1bC1zaGVlcGRvZy01ODQ4LmNsZXJrLmFjY291bnRzLmRldiQ"

[env]
  WEB_ORIGIN = "https://virtualchatrooms.pages.dev,https://*.virtualchatrooms.pages.dev,https://virtualchatrooms.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  # Ringing, live events and the realm keep state in memory: keep exactly one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "vcr_data"
  destination = "/data"

# Memory: see the note at swap_size_mb above.
[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
