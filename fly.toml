# Fly.io: one always-on machine (calls need the realm and live events running). See docs/deploy.md.
# Change `app` to the name you create with `fly apps create`; WEB_ORIGIN lists every address the
# web app is opened at (your Cloudflare Pages site and this Fly address).
app = "virtualchatrooms"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  WEB_ORIGIN = "https://virtualchatrooms.pages.dev,https://virtualchatrooms.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  # Ringing, live events and the realm keep state in memory: keep exactly one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "vcr_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
